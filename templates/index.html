<!DOCTYPE html>
<html>
<head>
    <title>Student Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
<h2>Student Grade Predictor</h2>

<form action="/predict" method="post">
<input name="age" required>
<input name="study_hours" required>
<input name="attendance" required>
<input name="math" required>
<input name="science" required>
<input name="english" required>
<input name="overall" required>

<button type="submit">Predict</button>
</form>

<h3>{{ prediction_text }}</h3>
</div>

</body>
</html>
